<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhoneKey Vault</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1b1f24; --quiet: #5b6470; --line: #dde1e6; --accent: #2563eb; --good: #15803d; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --card: #1a1f25; --ink: #e8eaed; --quiet: #9aa3ad; --line: #2c333b; --accent: #60a5fa; --good: #4ade80; --bad: #f87171; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .quiet { color: var(--quiet); }
  #qr { background: #fff; padding: 12px; border-radius: 8px; width: max-content; margin: 20px auto; }
  .phrase { font: 600 18px/1.6 ui-monospace, Consolas, monospace; letter-spacing: .5px; background: var(--bg); border: 1px dashed var(--line); border-radius: 8px; padding: 12px; word-break: break-all; }
  .status { margin-top: 16px; font-weight: 600; }
  .ok { color: var(--good); } .no { color: var(--bad); }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">PhoneKey Vault</h1>
    <div class="quiet" id="detail"></div>
    <div id="qr"></div>
    <p class="quiet" id="hint">Scan this with your phone's camera. Your phone must be on the same Wi-Fi as this PC.</p>
    <div id="phrase-box" hidden>
      <p><b>Recovery phrase.</b> Write this down on paper and keep it somewhere safe. It's the only way back in if you lose your phone. It won't be shown again.</p>
      <div class="phrase" id="phrase"></div>
    </div>
    <div class="status" id="status">Waiting for your phone...</div>
  </div>
</main>
<script>
  const titles = { pair: "Pair your phone", restore: "Approve this restore on your phone", revoke: "Approve removing a PC key" };
  let drawn = false;
  async function tick() {
    let s;
    try { s = await (await fetch("/api/pc", { cache: "no-store" })).json(); }
    catch { document.getElementById("status").textContent = "Finished. You can close this tab."; return; }
    document.getElementById("title").textContent = titles[s.kind] || "PhoneKey Vault";
    document.getElementById("detail").textContent = s.detail;
    if (!drawn) {
      new QRCode(document.getElementById("qr"), { text: s.qr, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
      drawn = true;
    }
    if (s.phrase) {
      document.getElementById("phrase-box").hidden = false;
      document.getElementById("phrase").textContent = s.phrase.match(/.{1,4}/g).join(" ");
    }
    const st = document.getElementById("status");
    if (s.status === "approved") { st.textContent = s.kind === "pair" ? "Phone paired. You can close this tab." : "Approved on your phone. Working..."; st.className = "status ok"; document.getElementById("qr").hidden = true; document.getElementById("hint").hidden = true; return; }
    if (s.status === "denied") { st.textContent = "Denied on your phone. Nothing was changed."; st.className = "status no"; return; }
    setTimeout(tick, 1000);
  }
  tick();
</script>
</body>
</html>
